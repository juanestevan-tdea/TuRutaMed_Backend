version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: turutamed_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: turutamed

  backend:
    build: .
    container_name: turutamed_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=turutamed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - .:/app

volumes:
  mongo_data: